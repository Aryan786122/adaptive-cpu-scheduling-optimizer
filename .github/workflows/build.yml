name: Windows Native C99 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MinGW GCC
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Compile Executable with GCC
      shell: cmd
      run: |
        build.bat

    - name: Run Automated Test Suite
      shell: pwsh
      run: |
        powershell.exe -ExecutionPolicy Bypass -File tests\test_suite.ps1

    - name: Package Standalone Release Artifact
      shell: cmd
      run: |
        package_release.bat

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: adaptive-cpu-scheduler-windows-x64
        path: dist/adaptive-cpu-scheduler-windows-x64.zip
